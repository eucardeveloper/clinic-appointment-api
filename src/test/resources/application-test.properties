# ── Test profile — uses the same PostgreSQL as CI (or local Docker) ───────────
# The CI workflow injects SPRING_DATASOURCE_URL / PGUSER / PGPASSWORD.
# Locally, spin up:  docker run -e POSTGRES_DB=clinic_db -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD=postgres123 -p 5432:5432 postgres:16-alpine
# If Docker / PostgreSQL is unreachable the ClinicApiApplicationTests is
# skipped automatically by DockerAvailableCondition.

# Let Hibernate create and drop the schema — safe for an isolated test DB
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Disable Flyway for the test profile — schema managed by Hibernate above
spring.flyway.enabled=false

# JWT test secret (must be ≥32 chars)
jwt.secret=test-secret-key-for-unit-testing-only-32chars!!
